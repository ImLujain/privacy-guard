<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="pgShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="pgHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield silhouette -->
  <path d="M100 14
           C 100 14, 60 30, 30 36
           L 30 100
           C 30 142, 60 174, 100 188
           C 140 174, 170 142, 170 100
           L 170 36
           C 140 30, 100 14, 100 14 Z"
        fill="url(#pgShield)"
        stroke="#3d2a72"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Top gloss -->
  <path d="M100 16
           C 100 16, 62 32, 33 38
           L 33 80
           C 60 70, 140 70, 167 80
           L 167 38
           C 138 32, 100 16, 100 16 Z"
        fill="url(#pgHighlight)"/>

  <!-- Fingerprint ridges (stylized concentric arcs) -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round" stroke-width="6" filter="url(#pgGlow)">
    <!-- outer arc -->
    <path d="M 60 112 Q 100 64, 140 112" stroke-opacity="0.95"/>
    <!-- mid arc -->
    <path d="M 72 122 Q 100 84, 128 122" stroke-opacity="0.85" stroke-width="5"/>
    <!-- inner arc -->
    <path d="M 84 132 Q 100 104, 116 132" stroke-opacity="0.75" stroke-width="4"/>
    <!-- core dot -->
    <circle cx="100" cy="124" r="3" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Bottom hint of a checkmark to convey "guard / verified" -->
  <path d="M 78 150 L 94 164 L 128 138"
        fill="none"
        stroke="#ffffff"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-opacity="0.95"/>
</svg>
